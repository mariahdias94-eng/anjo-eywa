<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>ANJO EYWA</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ANJO: pausas, check-in e Raio-X de bem-estar para cuidar do corpo, da mente e da natureza.">
<meta name="theme-color" content="#023F56">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ANJO">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<style>
/* Layout: o app num celular, ao lado de um console de demonstração (simular o dia, widget, painel EYWA). Empilha no celular. */
:root{
  /* Paleta da prancha do ANJO: dourado luz, creme, verde oliva, verde floresta, azul petróleo */
  /* fundo: branco com toque esmeralda e brilho */
  --page:#E8F6EF; --surface:#F7FDFA; --card:#F6E9CF; --card-2:#EEDDB8; --card-3:#E4CB97;
  --ink:#16302A; --muted:#4F6A61; --line:rgba(22,90,70,.13);
  --sheen-page:radial-gradient(70% 55% at 15% 0%,rgba(255,255,255,.95) 0%,rgba(255,255,255,0) 60%),radial-gradient(60% 50% at 100% 100%,rgba(46,175,125,.28) 0%,rgba(46,175,125,0) 70%),linear-gradient(160deg,#FFFFFF 0%,#EEF9F4 45%,#D9F1E6 100%);
  --sheen-app:radial-gradient(90% 40% at 20% 0%,rgba(255,255,255,1) 0%,rgba(255,255,255,0) 70%),radial-gradient(80% 45% at 100% 100%,rgba(60,190,140,.16) 0%,rgba(60,190,140,0) 70%),linear-gradient(180deg,#FFFFFF 0%,#F3FBF7 55%,#E6F6EE 100%);
  --gold:#D6A558; --gold-ink:#7E5A17; --forest:#3E7752; --olive:#6A7A3B; --petrol:#023F56; --lilac:#7D68AE; --danger:#A8432F;
  --on-gold:#2A1E08; --shadow:0 18px 50px rgba(2,63,86,.18); --soft:0 2px 10px rgba(2,63,86,.06);
  --f-display:"Sora","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Nunito Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#011820; --surface:#022F40; --card:#06384B; --card-2:#0A4459; --card-3:#0F5069;
  --ink:#F4E4C4; --muted:#A7BCB6; --line:rgba(244,228,196,.14);
  --gold-ink:#E9C27F; --forest:#72B68A; --olive:#A4B46A; --lilac:#B9A6E6; --danger:#E5826C; --shadow:0 18px 60px rgba(0,0,0,.5); --soft:none;
  --sheen-page:radial-gradient(60% 50% at 100% 100%,rgba(46,175,125,.18) 0%,rgba(46,175,125,0) 70%),linear-gradient(160deg,#022B38,#011820);
  --sheen-app:radial-gradient(80% 45% at 100% 100%,rgba(60,190,140,.12) 0%,rgba(60,190,140,0) 70%),linear-gradient(180deg,#023343,#022F40); color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#011820; --surface:#022F40; --card:#06384B; --card-2:#0A4459; --card-3:#0F5069;
  --ink:#F4E4C4; --muted:#A7BCB6; --line:rgba(244,228,196,.14);
  --gold-ink:#E9C27F; --forest:#72B68A; --olive:#A4B46A; --lilac:#B9A6E6; --danger:#E5826C; --shadow:0 18px 60px rgba(0,0,0,.5); --soft:none;
  --sheen-page:radial-gradient(60% 50% at 100% 100%,rgba(46,175,125,.18) 0%,rgba(46,175,125,0) 70%),linear-gradient(160deg,#022B38,#011820);
  --sheen-app:radial-gradient(80% 45% at 100% 100%,rgba(60,190,140,.12) 0%,rgba(60,190,140,0) 70%),linear-gradient(180deg,#023343,#022F40); color-scheme:dark}
*{box-sizing:border-box}
body{background-image:var(--sheen-page);background-attachment:fixed}
.phone{background-image:var(--sheen-app)}
.tabs{background:rgba(255,255,255,.72)!important;backdrop-filter:blur(10px)}
:root[data-theme="dark"] .tabs{background:rgba(2,47,64,.85)!important}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tabs{background:rgba(2,47,64,.85)!important}}
.overlay.light{background-image:var(--sheen-app)}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
p{margin:0}
.wrap{display:flex;gap:36px;justify-content:center;align-items:flex-start;flex-wrap:wrap;max-width:1120px;margin:0 auto}

/* ---------- celular ---------- */
.phone{width:390px;max-width:100%;height:min(840px,calc(100dvh - 48px));min-height:660px;background:var(--surface);
  border-radius:46px;border:10px solid #0F232B;box-shadow:var(--shadow);position:relative;overflow:hidden;display:flex;flex-direction:column}
.status{display:flex;justify-content:space-between;padding:12px 28px 2px;font-size:12px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.scr{flex:1;overflow-y:auto;padding:6px 18px 22px;min-height:0;scrollbar-width:thin}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding:6px 4px 12px}
.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:6px 0;border-radius:12px;font-weight:600}
.tabs button[aria-current="page"]{color:var(--gold-ink);font-weight:800}
.tabs button[aria-current="page"] svg{stroke:var(--gold)}
.tabs svg{width:22px;height:22px}

/* ---------- peças ---------- */
.appbar{display:flex;justify-content:space-between;align-items:center;margin:4px 0 14px}
.brand{display:flex;align-items:center;gap:8px}
.brand .wm{display:flex;flex-direction:column;line-height:1}
.brand .wm b{font-family:var(--f-display);font-weight:700;letter-spacing:.16em;font-size:15px;color:var(--gold-ink)}
.brand .wm span{font-size:8.5px;letter-spacing:.46em;color:var(--muted);font-weight:800;margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:800;background:var(--card-2);color:var(--gold-ink);border:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--soft)}
.stack{display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:800}
.meta{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{border:0;border-radius:999px;padding:10px 16px;font-weight:800;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.gold{background:var(--gold);color:var(--on-gold)}
.btn.green{background:var(--forest);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.small{padding:7px 12px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;padding:0;color:var(--gold-ink);font-weight:800;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--card-3);border-color:var(--gold);font-weight:800}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 8px}
.sec-h h3{font-size:15.5px}
.badge{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--card-2);color:var(--gold-ink);white-space:nowrap}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:13.5px}
textarea,input[type=text],input[type=time]{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;width:100%}
textarea{min-height:96px;resize:vertical}
.times{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.times .field label{font-size:12.5px;font-weight:600;color:var(--muted)}
select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px}

/* hero (azul petróleo, como a prancha) */
.hero{--ink:#F4E4C4;--muted:#B5CBC5;--line:rgba(244,228,196,.2);color:var(--ink);background:radial-gradient(120% 90% at 85% 0%,#0E5E7A 0%,#023F56 55%,#01303F 100%);border-radius:26px;padding:16px;position:relative;overflow:hidden}
.hero .top{display:flex;gap:12px;align-items:flex-start}
.bubble{background:#F4E4C4;color:#2A2416;border:1px solid #E6CF9F;border-radius:16px 16px 16px 4px;padding:10px 12px;font-size:14px;flex:1;min-width:0}
.hero .next{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;margin-top:14px}
.ringsm{position:relative;width:74px;height:74px}
.ringsm svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringsm b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums;line-height:1;text-align:center}
.ringsm b small{display:block;font-family:var(--f-body);font-size:10px;font-weight:700;color:var(--muted)}
.hero h2{font-size:17px;margin:2px 0}
.nowbtn{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card-2);border:1px solid var(--line);border-radius:22px;padding:12px 14px}
.nowbtn b{font-family:var(--f-display);font-size:15.5px;display:block}
.nowbtn .arrow{font-size:20px;color:var(--gold-ink)}
.ck-card{border:1.5px dashed var(--gold);background:var(--card)}
.recs{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.focus-bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:10px}
.focus-bar i{display:block;height:100%;background:var(--forest);width:0}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:46px 14px 1fr;gap:10px;align-items:start;padding:6px 0}
.tl time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);font-weight:800}
.tl .dot{width:12px;height:12px;border-radius:50%;margin-top:4px;background:var(--surface);border:2px solid var(--gold)}
.tl li.done .dot{background:var(--gold)}
.tl li.inv .dot{border-style:dashed}
.tl b{font-weight:700;font-size:14px;display:block}
.tl span{font-size:12.5px;color:var(--muted)}

/* práticas */
.prac{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;padding:8px 12px 8px 8px;border-radius:18px;background:var(--card);border:1px solid var(--line);text-align:left;width:100%}
.prac .th{width:72px;height:52px;border-radius:12px;overflow:hidden;display:block}
.prac .th svg{width:100%;height:100%;display:block}
.prac b{display:block;font-size:14.5px;line-height:1.25}
.prac small{color:var(--muted);font-size:12px}
.dur{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);font-weight:800;white-space:nowrap}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.seg .chip{white-space:nowrap}
.feature{border-radius:22px;overflow:hidden;border:1px solid var(--line);background:var(--card);text-align:left;width:100%;padding:0;display:block}
.feature svg{display:block;width:100%;height:auto}
.feature div{padding:12px 14px}
.search{position:relative}
.search input{padding-left:36px;border-radius:999px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted)}

/* overlay da pausa: imersivo em azul petróleo */
.overlay{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;padding:14px 18px 20px;overflow-y:auto}
.overlay.immersive{--ink:#F4E4C4;--muted:#B5CBC5;--line:rgba(244,228,196,.2);--card:#0A4A62;--card-2:#0D5570;--card-3:#126684;--gold-ink:#E9C27F;color:var(--ink);background:radial-gradient(120% 70% at 50% 0%,#0B5873 0%,#023F56 55%,#012C3D 100%)}
.overlay.light{background:var(--surface)}
.ov-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:transparent;display:grid;place-items:center;padding:0}
.iconbtn svg{width:18px;height:18px}
.iconbtn[aria-pressed="false"]{opacity:.5}
.stage{position:relative;margin:12px 0 8px;border-radius:24px;overflow:hidden}
.stage .illo{display:block;width:100%;height:auto}
.timerpill{position:absolute;right:10px;bottom:10px;background:rgba(1,44,61,.78);color:#F4E4C4;border-radius:999px;padding:5px 12px;font-family:var(--f-display);font-weight:600;font-variant-numeric:tabular-nums;font-size:15px}
.breathlbl{position:absolute;left:10px;bottom:10px;background:rgba(1,44,61,.78);color:#F4E4C4;border-radius:999px;padding:5px 12px;font-weight:800;font-size:13px}
.progress{height:5px;border-radius:5px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--gold);transition:width 1s linear}
.caption{min-height:78px;text-align:center;font-size:18px;padding:12px 4px 4px;text-wrap:balance;font-weight:600}
.caption small{display:block;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.steps-dots{display:flex;gap:6px;justify-content:center;margin:6px 0 14px}
.steps-dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.steps-dots i.on{background:var(--gold)}
.warn{background:var(--card-2);border-radius:16px;padding:12px 14px;font-size:13.5px}
.pause-actions{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pause-actions .btn:first-child{grid-column:1 / -1;padding:14px}
.illo .breath{transform-origin:150px 112px;transform-box:view-box}
.run .illo .breath{animation:breath 10s ease-in-out infinite}
@keyframes breath{0%{transform:scale(.7)}40%{transform:scale(1.12)}100%{transform:scale(.7)}}
.celebrate{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-top:24px;height:100%}
.celebrate h1{font-size:30px}
.spark{position:relative}
.spark i{position:absolute;width:6px;height:6px;border-radius:50%;background:#F1D08F;animation:spark 1.6s ease-out forwards;left:50%;top:50%}
@keyframes spark{from{transform:translate(-50%,-50%);opacity:1}to{transform:translate(var(--x),var(--y));opacity:0}}

/* notificação */
.notif{--ink:#F4E4C4;--muted:#A7C2BC;--line:rgba(244,228,196,.28);--card-3:#126684;color:var(--ink);position:absolute;left:10px;right:10px;top:34px;z-index:30;background:#023F56;border-radius:22px;padding:12px 14px;box-shadow:0 14px 40px rgba(0,0,0,.35);animation:drop .35s ease}
.notif .h{display:flex;gap:8px;align-items:center}
.notif p{margin:6px 0 10px;font-size:14px}
.alt{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);align-items:center}
.alt span{font-size:12px;color:var(--muted)}
@keyframes drop{from{transform:translateY(-20px);opacity:.3}to{transform:none;opacity:1}}

/* check-in */
.ck{display:flex;flex-direction:column;gap:14px;height:100%}
.ck h1{font-size:23px}
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.face{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:10px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700}
.face svg{width:34px;height:34px}
.face[aria-pressed="true"]{border-color:var(--gold);background:var(--card-3)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:13px 14px;text-align:left;font-weight:700}
.opt[aria-pressed="true"]{border-color:var(--gold);background:var(--card-3)}
.prog{display:flex;gap:4px;width:100%}
.prog i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.prog i.on{background:var(--gold)}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;width:100%}
.crisis{background:var(--card-2);border-left:4px solid var(--danger);border-radius:12px;padding:10px 12px;font-size:13.5px}

/* árvore e progresso */
.tree-box{display:grid;place-items:center;background:linear-gradient(var(--card-2),var(--card));border-radius:24px;padding:10px;border:1px solid var(--line)}
.stages{display:flex;justify-content:space-between;gap:2px;margin-top:10px}
.stages span{flex:1;min-width:0;text-align:center;font-size:9.5px;color:var(--muted);padding-top:6px;border-top:3px solid var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stages span.on{border-color:var(--forest);color:var(--ink);font-weight:800}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:12px}
.stat b{font-family:var(--f-display);font-size:22px;display:block;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:11.5px;color:var(--muted);display:block;margin-top:2px}
.segtabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card-2);border-radius:999px;padding:4px;margin-bottom:14px}
.segtabs button{border:0;background:transparent;border-radius:999px;padding:8px;font-weight:700;font-size:13px;color:var(--muted)}
.segtabs button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--soft)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:11px;font-weight:700}
.dims{display:flex;flex-direction:column;gap:10px}
.dimrow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center}
.dimrow .bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:4px}
.dimrow .bar i{display:block;height:100%}
.dimrow b{font-size:14px}
.dimrow small{color:var(--muted);font-size:12px}
.ico{border-radius:12px;display:grid;place-items:center;flex:none}
.insight{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}
.insight:last-child{border-bottom:0}
.insight i{width:10px;height:10px;border-radius:50%;background:var(--gold);margin-top:6px;justify-self:center}
.who q{display:block;font-weight:700;font-size:14px;quotes:none;margin:12px 0 6px}
.scale{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.scale button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 0;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.scale button[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.seedrules{width:100%;border-collapse:collapse;font-size:13.5px}
.seedrules td{padding:6px 0;border-bottom:1px solid var(--line)}
.seedrules td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:800}
details summary{cursor:pointer;font-weight:800;font-size:13.5px;color:var(--gold-ink)}

/* conversa */
.chat{display:flex;flex-direction:column;gap:8px;padding-bottom:8px}
.msg{max-width:84%;padding:10px 13px;border-radius:18px;font-size:14.5px}
.msg.a{background:#F4E4C4;color:#2A2416;border:1px solid #E6CF9F;border-bottom-left-radius:6px;align-self:flex-start}
.msg.u{background:#E9D3A6;color:#2A2416;border:1px solid #D9BC82;border-bottom-right-radius:6px;align-self:flex-end}
.msg .btn.ghost{border-color:rgba(42,36,22,.25);color:#2A2416}
.compose{display:flex;gap:8px;padding:8px 18px 4px;border-top:1px solid var(--line)}
.compose input{flex:1;min-width:0;border-radius:999px}

/* perfil e ajustes */
.avatar{width:54px;height:54px;border-radius:50%;background:var(--gold);color:var(--on-gold);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:22px;flex:none}
.understood{display:flex;flex-wrap:wrap;gap:6px}

.anjo{flex:none;display:block;overflow:visible}

const Music={ctx:null,master:null,nodes:[],
  ensure(){ if(this.ctx) return this.ctx; try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){this.ctx=null;} return this.ctx; },
  start(dim){
    if(!S.music) return; const c=this.ensure(); if(!c) return; try{c.resume();}catch(e){}
    this.stop(true);
    const m=c.createGain(); m.gain.value=0; m.gain.linearRampToValueAtTime(.11,c.currentTime+3);
    const lp=c.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=dim==="Corpo"?1800:1100; lp.connect(m); m.connect(c.destination);
    const ch={Corpo:[146.83,220,293.66,369.99],Mente:[110,164.81,220,261.63],Natureza:[130.81,196,261.63,329.63]}[dim]||[110,164.81,220,261.63];
    ch.forEach((f,i)=>{const o=c.createOscillator(); o.type=i%2?"sine":"triangle"; o.frequency.value=f; o.detune.value=(i-1.5)*5;
      const g=c.createGain(); g.gain.value=.16/(i+1)+.04; const l=c.createOscillator(); l.frequency.value=.05+i*.031; const lg=c.createGain(); lg.gain.value=.05;
      l.connect(lg); lg.connect(g.gain); o.connect(g); g.connect(lp); o.start(); l.start(); this.nodes.push(o,l);});
    if(dim==="Natureza"){ // vento suave
      const len=c.sampleRate*2, b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0); let last=0;
      for(let i=0;i<len;i++){ last=(last+.02*(Math.random()*2-1))/1.02; d[i]=last*3.5; }
      const n=c.createBufferSource(); n.buffer=b; n.loop=true; const bp=c.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=500; bp.Q.value=.6;
      const ng=c.createGain(); ng.gain.value=.5; n.connect(bp); bp.connect(ng); ng.connect(m); n.start(); this.nodes.push(n);
    }
    this.master=m;
  },
  chime(){ if(!S.music) return; const c=this.ensure(); if(!c) return; try{const o=c.createOscillator(),g=c.createGain(); o.type="sine"; o.frequency.value=880;
    g.gain.setValueAtTime(.0001,c.currentTime); g.gain.exponentialRampToValueAtTime(.08,c.currentTime+.02); g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+1.6);
    o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+1.7);}catch(e){} },
  stop(fast){ if(!this.ctx||!this.master) return; const c=this.ctx,m=this.master,ns=this.nodes;

};

  const best=Object.entries(S.stats).map(([id,st])=>({p:byId(id),r:(st.a+1)/(st.s+2)})).filter(x=>x.p&&S.stats[x.p.id].a>=2).sort((a,b)=>b.r-a.r)[0];

function anjoSays(t){
  if(crisisRe.test(t)) return {r:"Sinto muito que esteja assim. Você não precisa passar por isso sozinho. Ligue agora para o CVV no 188, de graça e a qualquer hora, ou fale com alguém de confiança. Eu fico aqui com você.",p:null};
  const l=t.toLowerCase();
  if(/(ansios|nervos|aflit|prova)/.test(l)) return {r:"Obrigado por contar. Antes da prova, a respiração 4–6 ajuda a acalmar. Topa um minuto comigo?",p:"r46"};
  if(/(travad|bloque|estress|tens)/.test(l)) return {r:"Vamos soltar um pouco. Três respirações, agora.",p:"resp3"};
  if(/(cansad|sono|exaust)/.test(l)) return {r:"Seus olhos devem estar pedindo descanso. 20 segundos olhando longe?",p:"distante"};
  if(/(costas|parad|sentad|pesco)/.test(l)) return {r:"Pescoço e ombros, um minuto e meio. Se houver dor forte, vá com calma.",p:"pescoco"};
  if(/(rotina|perfil|meu dia)/.test(l)) return {r:"Me conte no seu Perfil como é sua rotina e o que você precisa. Eu monto o plano do seu dia a partir disso.",p:null,go:"perfil"};
  if(/(menos|chato|muita)/.test(l)){S.perDay=Math.max(1,S.perDay-2);S.plan=buildPlan();save();return {r:`Combinado. Agora são no máximo ${S.perDay} sugestões por dia.`,p:null};}
  if(/(mais suges|mais pausas)/.test(l)){S.perDay=Math.min(10,S.perDay+2);S.plan=buildPlan();save();return {r:`Feito: até ${S.perDay} sugestões por dia.`,p:null};}
  if(/(semana|resumo)/.test(l)){const tot=weekData().reduce((a,b)=>a+(b||0),0);return {r:`Nesta semana você viveu ${tot} pausas, ${lastWeekTotal()?(tot-lastWeekTotal()>=0?tot-lastWeekTotal()+" a mais":lastWeekTotal()-tot+" a menos")+" que na anterior":"na sua primeira semana registrada"}, e tem ${S.seeds} sementes. Os detalhes estão em Árvore › Progresso.`,p:null,go:"progresso"};}
  if(/(pausa|ajuda|cuidar)/.test(l)) return {r:"Claro. Uma pausa curta para o corpo?",p:"maos"};
  return {r:"Entendi. Posso sugerir uma pausa, ajustar seu plano ou mostrar o resumo da semana. Como prefere?",p:null};
}

/* ================= Pausa guiada ================= */
let tick=null;
function startPause(id,first){
  const p=byId(id); if(!p) return; Voice.stop();
  const intro=p.size==="media"||p.size==="completa"||!!p.warn;
  pause={p,left:p.sec,phase:intro?"intro":"run",first:!!first,step:-1,el:0};
  notif=null; renderNotif(); ck=null; drawCk();
  if(!intro) beginRun(); else { drawPause(); Voice.speak(`${p.name}. ${fmt(p.sec).replace("min","minutos").replace(" s"," segundos")}.${p.warn?" Antes de começar: "+p.warn:""}`); }
}
function beginRun(){
  pause.phase="run"; pause.running=true; Music.start(FAM[pause.p.fam].d); clearInterval(tick);
  drawPause(); stepCheck();
  tick=setInterval(()=>{ if(!pause||pause.phase!=="run"||!pause.running) return; pause.left--; pause.el++; if(pause.left<=0){pause.left=0;pause.running=false; Voice.speak("Pronto. Perceba como você está agora."); Music.chime();} stepCheck(); drawPause(true); },1000);
}
function stepCheck(){
  const p=pause.p, k=1-pause.left/p.sec, si=Math.min(p.steps.length-1,Math.floor(k*p.steps.length));
  if(si!==pause.step&&pause.left>0){ pause.step=si; if(si===0) Voice.speak(`Vamos fazer ${p.name}. ${p.steps[0]}.`); else { Voice.speak(p.steps[si]); Music.chime(); } }
}
const IC={vol:'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6"/>',mus:'<path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="16" r="2"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>'};
const icon=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
function drawPause(light){
  let el=$("#phone .overlay.pz"); if(!pause){ if(el) el.remove(); return; }
  if(!el){el=document.createElement("div");el.className="overlay immersive pz";el.setAttribute("role","dialog");el.setAttribute("aria-label","Pausa guiada");$("#phone").appendChild(el);}
  const p=pause.p;
  if(light&&pause.phase==="run"&&el.querySelector(".timerpill")){ // atualização leve a cada segundo
    const k=1-pause.left/p.sec, si=Math.max(0,pause.step), fin=pause.left===0;
    el.querySelector(".timerpill").textContent=fin?"Concluída":clockF(pause.left);
    el.querySelector(".progress i").style.width=(k*100)+"%";
    el.querySelector(".caption").innerHTML=`<small>Passo ${si+1} de ${p.steps.length}</small>${fin?"Pronto. Respire e perceba como está.":esc(p.steps[si])}`;
    el.querySelectorAll(".steps-dots i").forEach((d,i)=>d.classList.toggle("on",i<=si));
    const bl=el.querySelector(".breathlbl"); if(bl) bl.textContent=(pause.el%10)<4?"Inspire":"Expire";
    const fb=el.querySelector("[data-finish]"); if(fb) fb.textContent=fin?"Concluir":"Concluir agora";
    const tg=el.querySelector("[data-toggle]"); if(tg) tg.textContent=pause.running?"Pausar":"Retomar";
    return;
  }
  const ctl=`<div class="row" style="gap:6px"><button class="iconbtn" data-narr aria-pressed="${S.narr}" aria-label="Narração">${icon("vol")}</button><button class="iconbtn" data-mus aria-pressed="${S.music}" aria-label="Música de fundo">${icon("mus")}</button>${pause.first&&pause.phase!=="done"?"":`<button class="iconbtn" data-close aria-label="Fechar">${icon("x")}</button>`}</div>`;
  if(pause.phase==="done"){
    const si=stageIdx(S.seeds), nxt=STAGES[si+1], prev=STAGES[si][1], kk=nxt?(S.seeds-prev)/(nxt[1]-prev):1;
    el.className="overlay immersive pz";
    el.innerHTML=`<div class="celebrate"><div class="spark">${anjo(140)}${Array.from({length:10},(_,i)=>`<i style="--x:${Math.round(Math.cos(i*.63)*90)}px;--y:${Math.round(Math.sin(i*.63)*90)}px"></i>`).join("")}</div>
      <div class="eyebrow">Conquista</div><h1>+${SIZE[p.size].seeds} ${SIZE[p.size].seeds>1?"sementes":"semente"}</h1>
      <p class="meta">${esc(p.name)} concluída. ${S.todayDone.length} de ${S.perDay} pausas hoje.</p>
      <div style="width:100%"><div class="between meta" style="font-size:12px;margin-bottom:4px"><span>${STAGES[si][0]}</span><span>${nxt?nxt[0]:""}</span></div><div class="progress"><i style="width:${kk*100}%"></i></div></div>
      <div class="eyebrow" style="margin-top:8px">Como foi?</div>
      <div class="chips" style="justify-content:center">${["Leve","Boa","Muito boa"].map(x=>`<button class="chip" data-rate>${x}</button>`).join("")}</div>
      <div class="foot"><button class="btn green" data-close>${pause.first?"Começar meu dia":"Voltar ao dia"}</button></div></div>`;
    return;
  }
  if(pause.phase==="intro"){
    el.className="overlay immersive pz";
    el.innerHTML=`<div class="ov-top"><span class="eyebrow">${FAM[p.fam].d} · ${FAM[p.fam].n} · ${fmt(p.sec)}</span>${ctl}</div>
      <div class="stage">${illo(p)}</div>
      <h1 style="font-size:24px">${esc(p.name)}</h1><p class="meta" style="margin:4px 0 12px">Por ${esc(p.author)} · narração e música · +${SIZE[p.size].seeds} sementes</p>
      ${p.warn?`<div class="warn"><b>Antes de começar.</b> ${esc(p.warn)} Em caso de dúvida, procure um profissional.</div>`:""}
      <ol class="meta" style="padding-left:18px;margin:12px 0">${p.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
      <div class="pause-actions"><button class="btn gold" data-begin>${p.warn?"Entendi, começar":"Começar"}</button></div>`;
    return;
  }
  const k=1-pause.left/p.sec, si=Math.max(0,pause.step), fin=pause.left===0, isResp=p.fam==="resp";
  el.className="overlay immersive pz run";
  el.innerHTML=`<div class="ov-top"><span class="eyebrow">${FAM[p.fam].n} · ${fmt(p.sec)}</span>${ctl}</div>
    <div class="stage">${illo(p)}<span class="timerpill">${fin?"Concluída":clockF(pause.left)}</span>${isResp?`<span class="breathlbl">Inspire</span>`:""}</div>
    <div class="progress"><i style="width:${k*100}%"></i></div>
    <h1 style="font-size:20px;text-align:center;margin-top:12px">${esc(p.name)}</h1>
    <div class="caption" aria-live="polite"><small>Passo ${si+1} de ${p.steps.length}</small>${fin?"Pronto. Respire e perceba como está.":esc(p.steps[si])}</div>
    <div class="steps-dots">${p.steps.map((_,i)=>`<i class="${i<=si?"on":""}"></i>`).join("")}</div>
    <div class="pause-actions">
      <button class="btn green" data-finish>${fin?"Concluir":"Concluir agora"}</button>
      ${pause.first?"":`<button class="btn ghost" data-toggle>${pause.running?"Pausar":"Retomar"}</button><button class="btn ghost" data-swap>Trocar</button>`}
    </div>`;
}
function finishPause(){
  const p=pause.p; S.seeds+=SIZE[p.size].seeds; S.done++; S.todayDone.push(p.id); S.refusals=0;
  const st=S.stats[p.id]||{s:0,a:0}; st.a++; if(st.s<st.a) st.s=st.a; S.stats[p.id]=st;
  const dr=dayRec(); dr.p++; (dr.ids=dr.ids||[]).push(p.id); if(pause.first) S.onboarded=true;
  save(); clearInterval(tick); Voice.speak(`Muito bem. Você ganhou ${SIZE[p.size].seeds} ${SIZE[p.size].seeds>1?"sementes":"semente"}.`); Music.stop(); Music.chime();
  pause.phase="done"; pause.running=false; drawPause();
}
function closePause(){
  const wasFirst=pause&&pause.first&&pause.phase==="done"; clearInterval(tick); Voice.stop(); Music.stop(); pause=null; drawPause();
  if(wasFirst){onbStep=-1;tab="hoje";} render();
}

const greetPart=()=>{const h=new Date().getHours();return h<12?"Bom dia":h<18?"Boa tarde":"Boa noite";};
function planMsg(m,p){
  const L=(m.lbl||"").toLowerCase();
  if(/seu momento/.test(L)) return `Lembrete que você pediu: ${m.lbl.replace(/^Seu momento: /,"")}.`;
  if(/aula|foco/.test(L)) return "Boa sessão. Que tal uma pausa para o corpo?";
  if(/almoço/.test(L)) return "Antes do almoço: que tal comer com calma, sem tela?";
  if(/levantar/.test(L)) return "O corpo está parado há um tempo. Que tal levantar um pouco?";
  if(/fim do expediente/.test(L)) return "Fim do expediente. Uma pausa para fechar o dia com leveza?";
  if(/dormir/.test(L)) return "Quer fazer o ritual de sono hoje? É só um convite.";
  if(/começo do dia|início/.test(L)) return `${greetPart()}. Começar com calma: ${p.name.toLowerCase()}?`;
  return `Hora de uma pausa: ${p.name.toLowerCase()}, ${fmt(p.sec)}.`;
}
async function sysNotify(title,body,action){
  if(!S.notify||!("Notification" in window)||Notification.permission!=="granted") return;
  if(document.visibilityState==="visible") return; // com o app aberto, o aviso aparece dentro dele
  const opts={body,tag:"anjo-"+action,icon:"icons/icon-192.png",badge:"icons/icon-192.png",data:{action}};
  try{ const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration(); if(reg) reg.showNotification(title,opts); else new Notification(title,opts); }catch(e){}
}
function requestNotify(){
  if(!("Notification" in window)){ toast("Este navegador não permite lembretes"); return Promise.resolve(false); }
  return Notification.requestPermission().then(p=>{ S.notify=p==="granted"; save(); toast(S.notify?"Lembretes ativados":"Lembretes não autorizados no navegador"); return S.notify; });
}
function fire(m){
  if(onbStep>=0||pause||scan||ck) return false;
  if(m.ckRemind){ notif={m:{msg:`${greetPart()}${S.name?", "+S.name:""}. Como você está hoje? O check-in leva 30 segundos e eu ajusto as práticas do dia.`},ckr:true}; renderNotif(); sysNotify("Como você está hoje?","Faça seu check-in no ANJO.","ck"); return true; }
  if(m.rescan){ notif={m:{msg:"Já se passaram 2 semanas. Refaça seu Raio-X e veja o que mudou no seu corpo e na sua mente."},rx:true}; renderNotif(); sysNotify("Hora do seu Raio-X","Veja o que mudou em 2 semanas.","rx"); return true; }
  if(!m.invite&&toMin(nowT)>=toMin(S.quietFrom)) return false;
  if(!m.invite&&S.refusals>=2) return false;
  if(!m.invite&&S.shownToday>=S.perDay) return false;
  let p=m.id&&byId(m.id)&&allowed(byId(m.id))?byId(m.id):choose(m).p;
  if(!m.invite) S.shownToday++; const st=S.stats[p.id]||{s:0,a:0}; st.s++; S.stats[p.id]=st; save();
  m=Object.assign({},m,{t:nowT,msg:m.msg||planMsg(m,p)});
  notif={m,p}; renderNotif(); sysNotify(m.invite?"Um convite do ANJO":"Hora de uma pausa",`${p.name} · ${fmt(p.sec)}`,p.id);
  return true;
}
function endFocus(){
  const len=S.focusLen; S.focusStart=null; dayRec().f+=len; save(); if(tab==="hoje"&&!pause) render();
  fire({lbl:`Fim de estudo de ${len} min`,size:len>=50?"curta":"micro",fav:len>=50?"corpo":"olhos",msg:len>=50?"Boa sessão de estudo. Suas mãos e olhos trabalharam muito: uma pausa curta?":"Bloco concluído. 20 segundos para os olhos?"});
}
// relógio do app: confere o plano a cada 30 segundos
let lastMin="";
function clockTick(){
  const changed=rollover(); if(changed){ S.plan=buildPlan(); save(); }
  nowT=nowStr(); const now=toMin(nowT);
  if(S.refusedAt&&Date.now()-S.refusedAt>3*36e5){ S.refusals=0; S.refusedAt=null; save(); }
  if(S.focusStart&&Date.now()-S.focusStart>=S.focusLen*60000) endFocus();
  if(S.onboarded){
    if(!S.today&&!S.fired.includes("ck")&&now>=toMin(S.ckTime)&&now-toMin(S.ckTime)<=180){ if(fire({ckRemind:true})){S.fired.push("ck");save();} }
    const last=S.scans[S.scans.length-1];
    if(last&&last.date&&daysBetween(last.date,TODAY)>=14&&!S.fired.includes("rx")&&now>=toMin("10:00")){ if(fire({rescan:true})){S.fired.push("rx");save();} }
    (S.plan||[]).forEach(m=>{ const key=m.t+"|"+m.id, tm=toMin(m.t);
      if(S.fired.includes(key)||now<tm||now-tm>20) return;
      const p=byId(m.id); if(fire({t:m.t,lbl:m.lbl,id:m.id,invite:m.invite,size:p?p.size:"micro"})){S.fired.push(key);save();} });
  }
  if((changed||nowT!==lastMin)&&tab==="hoje"&&onbStep<0&&!pause&&!scan&&!ck&&!(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName))){ const sc=$("#scr"), st=sc.scrollTop; render(); sc.scrollTop=st; }
  lastMin=nowT;
}
function renderNotif(){
  let el=$("#phone .notif");
  if(!notif||pause){ notif=pause?null:notif; if(!notif&&el) el.remove(); if(!notif) return; }
  if(!el){el=document.createElement("div");el.className="notif";el.setAttribute("role","alert");$("#phone").appendChild(el);}
  if(notif.rx){ el.innerHTML=`<div class="h">${anjoLogo(28)}<b style="font-size:13px">ANJO</b><span class="meta">· Raio-X</span></div><p>${esc(notif.m.msg)}</p><div class="row"><button class="btn gold small" data-n="rx">Refazer agora</button><button class="btn ghost small" data-n="fechar">Depois</button></div>`; return; }
  if(notif.ckr){ el.innerHTML=`<div class="h">${anjoLogo(28)}<b style="font-size:13px">ANJO</b><span class="meta">· check-in</span></div><p>${esc(notif.m.msg)}</p><div class="row"><button class="btn gold small" data-n="ck">Fazer check-in</button><button class="btn ghost small" data-n="fechar">Depois</button></div>`; return; }
  const {m,p}=notif;
  el.innerHTML=`<div class="h">${anjoLogo(28)}<b style="font-size:13px">ANJO</b><span class="meta">· ${m.invite?"convite":"agora"}</span></div>
    <p>${esc(m.msg)}<br><span class="meta">${esc(p.name)} · ${fmt(p.sec)} · narrada</span></p>
    <div class="row"><button class="btn gold small" data-n="agora">${m.invite?"Quero":"Fazer agora"}</button>${m.invite?"":`<button class="btn ghost small" data-n="adiar">Daqui a 10 min</button>`}<button class="btn ghost small" data-n="nao">${m.invite?"Agora não":"Hoje não"}</button></div>
    ${m.invite?"":`<div class="alt"><span>Prefere outra?</span>${[["corpo","Movimento"],["resp","Respiração"],["olhos","Descanso visual"]].map(([f,l])=>`<button class="chip" data-alt="${f}">${l}</button>`).join("")}</div>`}`;
}

/* ================= eventos ================= */
document.addEventListener("keydown",e=>{ const g=e.target.closest&&e.target.closest("g[data-reg]"); if(g&&(e.key==="Enter"||e.key===" ")){ e.preventDefault(); g.dispatchEvent(new MouseEvent("click",{bubbles:true})); } });
document.addEventListener("click",e=>{
  const rg=e.target.closest("[data-reg]"); if(rg&&scan&&scan.i===5){ const k=rg.dataset.reg, v=scan.a.pain[k]||0; scan.a.pain[k]=v>=9?0:v+3; drawScan(); return; }
  const t=e.target.closest("button"); if(!t) return; const d=t.dataset;
  if(d.scan!==undefined){ openScan(); return; }
  if(d.endtrail!==undefined){ S.trail=null; save(); render(); return; }
  if(d.install!==undefined){ if(installEvt){ installEvt.prompt(); installEvt=null; } return; }
  if(d.scclose!==undefined){ closeScan(); return; }
  if(d.scnext!==undefined){ scanNext(); return; }
  if(d.scback!==undefined){ if(scan.br&&!scan.br.done){clearInterval(scan.br.timer);scan.br=null;} scan.i=Math.max(0,scan.i-1); scan.anim=false; drawScan(); return; }
  if(d.sw){ const [k,v]=d.sw.split(":").map(Number); scan.a.who5[k]=v; drawScan(); return; }
  if(d.sp){ const [k,v]=d.sp.split(":").map(Number); scan.a.pss[k]=v; drawScan(); return; }
  if(d.sq){ scan.a.sonoQ=d.sq; drawScan(); return; }
  if(d.sh){ scan.a.sonoH=d.sh; drawScan(); return; }
  if(d.ss){ scan.a.sentado=d.ss; drawScan(); return; }
  if(d.sn){ scan.a.nat=d.sn; drawScan(); return; }
  if(d.spostC){ scan.a.post.cabeca=d.spostC; drawScan(); return; }
  if(d.spostO){ scan.a.post.ombros=d.spostO; drawScan(); return; }
  if(d.brtap!==undefined){ brTap(); return; }
  if(d.trail){ if(!scan) scan={i:10,a:null}; scan.pick=d.trail; scan.anchor=null; scan.i=10; drawScan(); return; }
  if(d.anchor){ scan.anchor=d.anchor; drawScan(); return; }
  if(d.trailstart!==undefined){ startTrail(); return; }
  if(d.trailback!==undefined){ scan.i=9; drawScan(); return; }
  if(d.tab){ if(d.tab!=="perfil"&&tab==="perfil") readProfile(); tab=d.tab; confirmDel=false; render(); $("#scr").scrollTop=0; return; }
  if(d.go){ if(d.go==="progresso"||d.go==="raiox"){tab="arvore";sub=d.go;} else tab=d.go; render(); $("#scr").scrollTop=0; return; }
  if(d.start){ startPause(d.start,d.first!==undefined); return; }
  if(d.begin!==undefined){ beginRun(); return; }
  if(d.now!==undefined){ const t0=S.today; const m={n:"Pedido agora",t:nowT,size:t0&&t0.energia==="baixa"?"micro":"curta",fav:t0&&t0.tensao==="alta"?"resp":"corpo"};
    const {p,why}=choose(m); addLog(nowT,`<b>Você pediu uma pausa</b> → <b>${esc(p.name)}</b><br><span class="w">${why}</span>`); startPause(p.id); return; }
  if(d.focus!==undefined){ if(S.focusStart){ dayRec().f+=Math.round((Date.now()-S.focusStart)/60000); S.focusStart=null; } else S.focusStart=Date.now(); save(); render(); return; }
  if(d.flen){ S.focusLen=+d.flen; save(); render(); return; }
  if(d.ck!==undefined){ openCk(); return; }
  if(d.ckclose!==undefined){ ck=null; drawCk(); if(tab==="hoje") render(); return; }
  if(d.cka){ const qq=CK[ck.i]; let v=qq.face?+d.cka:d.cka;
    if(qq.multi){ let a=ck.a.corpo||[]; if(v==="nada") a=["nada"]; else { a=a.filter(x=>x!=="nada"); a=a.includes(v)?a.filter(x=>x!==v):a.concat(v);} ck.a.corpo=a; }
    else ck.a[qq.k]=v; drawCk(); return; }
  if(d.cknext!==undefined){ const n=$("#cknote"); if(n) ck.a.nota=n.value; ck.i++; if(ck.i>=CK.length) finishCk(); drawCk(); return; }
  if(d.ckback!==undefined){ ck.i=Math.max(0,ck.i-1); drawCk(); return; }
  if(d.filt){ filt=d.filt; renderExplorar(); return; }
  if(d.sub){ sub=d.sub; renderArvore(); return; }
  if(d.who){ if(d.who==="start") who5Ans=[null,null,null,null,null]; else { const v=who5Ans.reduce((a,b)=>a+b,0)*4; S.who5.push({w:fmtDate(TODAY),v}); if(S.who5.length>3) S.who5.splice(1,1); who5Ans=null; save(); toast("Resultado salvo: "+v+" pontos"); } renderArvore(); return; }
  if(d.whoq!=null&&d.whov!=null){ who5Ans[+d.whoq]=+d.whov; const sc=$("#scr").scrollTop; renderArvore(); $("#scr").scrollTop=sc; return; }
  if(d.q){ if(/rotina/.test(d.q)){ send(d.q); return; } send(d.q); return; }
  if(d.onb){ if(d.perm!==undefined) requestNotify(); if(onbStep===1){ const n=$("#oname"); if(n&&n.value.trim()) S.name=n.value.trim(); readProfile(); } if(onbStep===2) readProfile(); onbStep++; save(); render(); return; }
  if(d.osafe){ S.safety[d.osafe]=!S.safety[d.osafe]; save(); renderOnb(); return; }
  if(d.pest){ readProfile(); S.profile.estudo=d.pest; save(); onbStep>=0?renderOnb():renderPerfil(); return; }
  if(d.plug){ readProfile(); S.profile.lugar=d.plug; save(); renderPerfil(); return; }
  if(d.goal){ readProfile(); S.goals=S.goals.includes(d.goal)?S.goals.filter(x=>x!==d.goal):S.goals.concat(d.goal); save(); renderPerfil(); return; }
  if(d.plan!==undefined){ readProfile(); const u=personalize(); toast(`Plano atualizado: ${S.plan.length} momentos`); addLog(nowT,`<b>Perfil atualizado</b> <span class="w">entendi ${u.length} pontos; plano refeito com ${S.plan.filter(m=>!m.invite).length} sugestões.</span>`); renderPerfil(); return; }
  if(d.addrem!==undefined){ readProfile(); const tt=$("#remT").value, l=$("#remL").value.trim(); if(!tt||!l){toast("Escolha um horário e escreva o que lembrar");return;} S.reminders.push({t:tt,l}); S.plan=buildPlan(); save(); renderPerfil(); toast("Momento adicionado ao seu plano"); return; }
  if(d.rmrem!=null){ readProfile(); S.reminders.splice(+d.rmrem,1); S.plan=buildPlan(); save(); renderPerfil(); return; }
  if(d.narr!==undefined){ S.narr=!S.narr; save(); if(!S.narr) Voice.stop(); t.setAttribute("aria-pressed",S.narr); return; }
  if(d.mus!==undefined){ S.music=!S.music; save(); if(S.music&&pause&&pause.phase==="run") Music.start(FAM[pause.p.fam].d); else Music.stop(); t.setAttribute("aria-pressed",S.music); return; }
  if(d.finish!==undefined){ finishPause(); return; }
  if(d.toggle!==undefined){ pause.running=!pause.running; if(!pause.running){Voice.stop();} drawPause(); return; }
  if(d.swap!==undefined){ const alt=P.filter(x=>x.size===pause.p.size&&x.id!==pause.p.id&&allowed(x)); const n=alt[Math.floor(Math.random()*alt.length)]||pause.p; Music.stop(true); startPause(n.id); return; }
  if(d.close!==undefined){ closePause(); return; }
  if(d.rate!==undefined){ t.parentElement.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c===t)); return; }
  if(d.alt){ const {m,p}=notif; const order=["micro","curta","media"]; const opts=P.filter(x=>x.fam===d.alt&&x.size!=="completa"&&allowed(x)).sort((a,b)=>Math.abs(order.indexOf(a.size)-order.indexOf(p.size))-Math.abs(order.indexOf(b.size)-order.indexOf(p.size)));
    const n=opts[0]||p; addLog(m.t,`<span class="w">Trocou para ${esc(t.textContent.toLowerCase())}: ${esc(n.name)}</span>`); startPause(n.id); return; }
  if(d.n){
    if(d.n==="resumo"){ notif=null; renderNotif(); tab="arvore"; sub="progresso"; render(); return; }
    if(d.n==="fechar"){ notif=null; renderNotif(); return; }
    if(d.n==="ck"){ notif=null; renderNotif(); openCk(); return; }
    if(d.n==="rx"){ notif=null; renderNotif(); openScan(); return; }
    const {m,p}=notif;
    if(d.n==="agora"){ addLog(m.t,`<span class="w">Aceitou: ${esc(p.name)}</span>`); startPause(p.id); }
    if(d.n==="adiar"){ notif=null; renderNotif(); toast("Combinado, daqui a 10 minutos"); addLog(m.t,`<span class="w">Adiou 10 min: ${esc(p.name)}</span>`); setTimeout(()=>{ if(!pause&&!ck&&onbStep<0){notif={m:Object.assign({},m,{msg:"Lembra da pausa de 10 minutos atrás? Ainda dá tempo."}),p};renderNotif();} },600000); }
    if(d.n==="nao"){ if(!m.invite){S.refusals++;S.refusedAt=Date.now();} save(); notif=null; renderNotif(); toast(m.invite?"Tudo bem. Fica para outro dia.":"Tudo bem. Hoje não."); addLog(m.t,`<span class="w">${m.invite?"Recusou o convite (sem contar como recusa)":"Recusou ("+S.refusals+" seguida"+(S.refusals>1?"s":"")+")"}: ${esc(p.name)}</span>`); }
    return;
  }
});

let installEvt=null;
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); installEvt=e; if(tab==="perfil") render(); });
const isStandalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
function applyTheme(){ const r=document.documentElement; if(S.theme==="auto") delete r.dataset.theme; else r.dataset.theme=S.theme; }
function handleAction(a){
  if(!a||!S.onboarded) return;
  if(a==="ck") openCk(); else if(a==="rx") openScan(); else if(byId(a)) startPause(a);
}
applyTheme();
S.plan=buildPlan(); save();
if(!S.onboarded) onbStep=0;
render();
lastMin=nowT; setInterval(clockTick,30000);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") clockTick(); });
if(S.focusStart&&tab==="hoje") runFocus();
// abrir uma prática ou o check-in a partir da notificação
try{ const a=new URLSearchParams(location.search).get("a"); if(a){ history.replaceState(null,"",location.pathname); setTimeout(()=>handleAction(a),300); } }catch(e){}
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
  navigator.serviceWorker.addEventListener("message",e=>{ if(e.data&&e.data.a) handleAction(e.data.a); });
}
})();
</script>
